services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: threatmail-backend
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - VT_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4.1-mini}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.2}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-openrouter}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: threatmail-frontend
    ports:
      - "3000:5173"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:${PORT:-8000}
    restart: unless-stopped
